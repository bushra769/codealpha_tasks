<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Social Media</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Create Post</h1>

        <form id="postForm">

            <textarea
                id="postContent"
                placeholder="What's on your mind?"
                rows="6"
                required
            ></textarea>

            <button type="submit">Create Post</button>

        </form>

        <p id="postMessage"></p>

        <p>
            <a href="profile.html">Back to Profile</a>
        </p>

    </div>

    <script src="create-post.js"></script>

</body>
</html>
