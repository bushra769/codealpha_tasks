<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Product Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            🛍️ ShopEase
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products-section">
                Products
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- PRODUCT DETAILS -->

    <main class="details-container">

        <div id="productDetails">

            <p>Loading product...</p>

        </div>

    </main>


    <script>

        const API_URL =
            "http://127.0.0.1:5000/api/products";


        async function loadProduct() {

            const params =
                new URLSearchParams(window.location.search);

            const productId =
                params.get("id");


            if (!productId) {

                document.getElementById(
                    "productDetails"
                ).innerHTML = `
                    <h2>Product not found</h2>
                    <a href="index.html">
                        Back to Shop
                    </a>
                `;

                return;
            }


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "Unable to load products"
                    );

                }


                const products =
                    await response.json();


                const product =
                    products.find(
                        item =>
                            item.id == productId
                    );


                if (!product) {

                    document.getElementById(
                        "productDetails"
                    ).innerHTML = `
                        <h2>Product not found</h2>
                        <a href="index.html">
                            Back to Shop
                        </a>
                    `;

                    return;
                }


                document.getElementById(
                    "productDetails"
                ).innerHTML = `

                    <div class="details-card">

                        <div class="details-image">

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                            >

                        </div>


                        <div class="details-content">

                            <span class="details-label">
                                ShopEase Product
                            </span>

                            <h1>
                                ${product.name}
                            </h1>

                            <p class="details-description">
                                ${product.description}
                            </p>

                            <h2 class="details-price">
                                Rs. ${product.price}
                            </h2>

                            <button
                                class="auth-btn"
                                onclick="addToCart()"
                            >
                                🛒 Add to Cart
                            </button>

                            <br><br>

                            <a
                                href="index.html#products-section"
                                class="back-link"
                            >
                                ← Back to Products
                            </a>

                        </div>

                    </div>

                `;


                // Add product to cart

                window.addToCart = function() {

                    let cart =
                        JSON.parse(
                            localStorage.getItem("cart")
                        ) || [];


                    const existing =
                        cart.find(
                            item =>
                                item.id == product.id
                        );


                    if (existing) {

                        existing.quantity++;

                    } else {

                        cart.push({
                            ...product,
                            quantity: 1
                        });

                    }


                    localStorage.setItem(
                        "cart",
                        JSON.stringify(cart)
                    );


                    alert(
                        "✅ Product added to cart!"
                    );

                };


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "productDetails"
                ).innerHTML = `
                    <h2>
                        Unable to connect to server.
                    </h2>

                    <a href="index.html">
                        Back to Shop
                    </a>
                `;

            }

        }


        loadProduct();

    </script>

</body>

</html>
